  <style>

  nav {
    position: relative;
    z-index: 5;

    display: flex;
    padding: 1% 3%;
    justify-content: space-between;
    align-items: center;
    background-color: #222;
}

nav img {
    width: 150px;
}

.nav-links {
    flex: 1;
    text-align: right;
}

.nav-links ul {
    list-style: none;
}

.nav-links ul li {
    display: inline-block;
    padding: 8px 12px;
    position: relative;
}

.nav-links ul li a {
    color: white;
    text-decoration: none;
    font-size: 13px;
    font-family: Arial, Helvetica, sans-serif;
    text-transform: uppercase;
    transition: 0.3s ease;
}

.logo {
    display: flex;
    align-items: center;
    gap: 10px;
    color: white;
}


.logo h2 {
    margin: 0;
    font-family: Georgia, serif;
    font-size: 23px;
}

.logo span {
    font-size: 11px;
    color: #ccc;
}

.nav-links ul li a:hover {
    color: #e5aa32;
}

#home-btn a {
    color: #b8860b;
}

.nav-links button {
    padding: 10px 2rem;
    border: 1px solid transparent;
    border-radius: 10px;
    background-color: #b8860b;
    color: white;
    cursor: pointer;
    transition: 0.3s ease;
}

.nav-links button:hover {
    background-color: #e5aa32;
    transform: translateY(-2px);
}

/* =========================
   GALLERY
========================= */

.gallery {
    background: #f7f5f0;
}
h2 {
    font-family: Georgia, serif;
    font-size: 30px;
    text-align: center;
    margin-bottom: 10px;
    font-size: 5rem;
}

p {
    text-align: center;
    margin-bottom: 20px;
    color: #555;
    margin-top: 3rem;
    font-size: 3rem;
}
h2 span{
  color: #b8860b;

}


.gallery-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 20px;
    padding: 20px;
    max-width: 1200px;
    margin: auto;
}

.gallery-grid img {
    width: 100%;
    height: auto;
    border-radius: 10px;
    transition: transform 0.3s ease;
}

.gallery-grid img:hover {
    transform: scale(1.05);
}


/* =========================
   FOOTER
========================= */

footer {
    background: #111c1c;
    color: #fff;
    padding-top: 70px;
}

.footer-container {
    max-width: 1200px;
    max-height: 1000px;
    margin: auto;
    padding: 0 1% 50px;
    display: grid;
    grid-template-columns: 2fr 1fr 1fr 1fr;
    gap: 50px;
}

.footer-brand p {
    color: #999;
    font-size: 13px;
    margin-top: 20px;
    max-width: 250px;
}

.footer-links h3,
.footer-social h3 {
    font-size: 15px;
    margin-bottom: 20px;
}

.footer-links a {
    display: block;
    color: #999;
    font-size: 13px;
    margin-bottom: 10px;
    transition: 0.3s;
}

.footer-links a:hover {
    color: #d4a72c;
}

.social-icons {
    display: flex;
    gap: 10px;
}

.social-icons a {
    width: 38px;
    height: 38px;
    display: grid;
    place-items: center;
    border: 1px solid #444;
    color: #fff;
    transition: 0.3s;
}

.social-icons a:hover {
    background: #b8860b;
    border-color: #b8860b;
}





</style>
